# Harness profile: OpenAI Codex CLI. See specs/HARNESS_PROFILES.md.
# Codex's hooks (https://developers.openai.com/codex/hooks) mirror Claude Code's:
# stdin JSON with tool_use_id correlation. codex_transcript.py reads the turns.
#
# Codex has no SessionEnd, so a session whose last turn gets no Stop, such as one
# killed mid-turn, loses that turn. A denied call simply has no PostToolUse.

[harness]
name    = "codex"

[config_surface]
# Deliberately-edited context artifacts that shape agent behavior, hashed into
# weave_agent_adapter.config_version — the A/B cohort key for evaluating
# config changes. Excluded: ~/.codex/config.toml (it churns with trust lists,
# MCP servers, and auth; the model is recorded separately) and ambient state
# (memories, sessions, sqlite files, caches), which would flip the version
# constantly and shatter cohorts.
paths = [
  "~/.codex/AGENTS.md",
  "~/.codex/skills",
  "~/.codex/agents",
  "~/.codex/rules",
  "{cwd}/AGENTS.md",
]
# Codex installs and rewrites its bundled skills here itself, so a Codex
# upgrade would change the version with no edit by the user.
exclude = ["~/.codex/skills/.system"]

[registration]
user_path  = "~/.codex/hooks.json"           # install (default scope)
local_path = ".codex/hooks.json"             # install --local
command    = "weave-agent-adapter hook --harness codex"   # installer appends --event <event>
post_install = "Codex skips new or changed non-managed hooks until trusted; review and trust them with /hooks."
events  = [
  "SessionStart", "UserPromptSubmit", "PreToolUse", "PermissionRequest",
  "PostToolUse", "SubagentStart", "SubagentStop", "PreCompact", "Stop",
]
